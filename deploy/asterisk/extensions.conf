; ==============================================================================
; Asterisk Extensions Dialplan (Production Hardened)
; Inbound: from-provider-24ithub -> FastAPI Port 8010 -> AudioSocket Port 9095
; Outbound: Answer-Gated outbound-ai-answered -> AudioSocket Port 9095
; Hangup: call-hangup-handler -> FastAPI Hangup Webhook
; ==============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

; Global variables
[globals]
BACKEND_HOST=127.0.0.1
BACKEND_PORT=8010
AUDIOSOCKET_PORT=9095
WEBHOOK_SECRET=your_shared_webhook_secret

; ==============================================================================
; INBOUND ROUTING CONTEXT: [from-provider-24ithub]
; Handles incoming PSTN calls delivered via 24IT Hub SIP trunk
; ==============================================================================
[from-provider-24ithub]
exten => _.,1,NoOp(=== INBOUND CALL DETECTED ON TRUNK ===)
 same => n,Set(RAW_CALLER=${CALLERID(num)})
 same => n,Set(RAW_EXTEN=${EXTEN})
 
 ; 1. Detect and normalize dialed DID
 ; If extension is 's', empty, or non-numeric, extract from SIP 'To' header
 same => n,GotoIf($["${RAW_EXTEN}" = "s" | "${RAW_EXTEN}" = ""]?extract_to:use_exten)
 
 same => n(extract_to),Set(SIP_TO=${PJSIP_HEADER(read,To)})
 same => n,Set(EXTRACTED_DID=${CUT(CUT(SIP_TO,@,1),:,2)})
 same => n,GotoIf($["${EXTRACTED_DID}" != ""]?set_did:use_exten)
 same => n(set_did),Set(DIALED_DID=${EXTRACTED_DID})
 same => n,Goto(did_ready)
 
 same => n(use_exten),Set(DIALED_DID=${RAW_EXTEN})
 
 same => n(did_ready),Set(CLEAN_DID=${FILTER(0123456789,${DIALED_DID})})
 same => n,Set(CLEAN_CALLER=${FILTER(0123456789,${RAW_CALLER})})
 same => n,NoOp(Inbound Normalized: Caller=${CLEAN_CALLER}, DID=${CLEAN_DID})
 
 ; Initial UniqueID from Asterisk channel (never throws unregistered func error)
 same => n,Set(CALL_UUID=${UNIQUEID})
 
 ; 2. Request Call Authorization from FastAPI backend
 same => n,Set(AUTH_URL=http://${BACKEND_HOST}:${BACKEND_PORT}/api/webhooks/asterisk/inbound?caller_id=${CLEAN_CALLER}&dialed_number=${CLEAN_DID}&call_uuid=${CALL_UUID}&provider=asterisk&secret=${WEBHOOK_SECRET})
 same => n,Set(CALL_PERMISSION=${CURL(${AUTH_URL})})
 same => n,NoOp(FastAPI Authorization Response: ${CALL_PERMISSION})
 
 ; 3. Check authorization contract (Fail-Closed: only proceed if response starts with "ALLOW")
 same => n,GotoIf($["${CALL_PERMISSION:0:5}" = "ALLOW"]?allow_call:reject_call)
 
 same => n(reject_call),NoOp(Call rejected by policy: ${CALL_PERMISSION})
 same => n,Hangup(21)
 
 same => n(allow_call),NoOp(Call authorized - Answering and initiating AudioSocket streaming)
 ; Extract authoritative RFC4122 UUID returned by FastAPI backend (ALLOW:<uuid>)
 same => n,Set(BACKEND_UUID=${CALL_PERMISSION:6})
 same => n,GotoIf($["${BACKEND_UUID}" != ""]?set_backend_uuid:keep_uuid)
 same => n(set_backend_uuid),Set(CALL_UUID=${BACKEND_UUID})
 same => n(keep_uuid),NoOp(Final Call UUID for AudioSocket: ${CALL_UUID})
 same => n,Set(CHANNEL(hangup_handler_push)=call-hangup-handler,s,1(${CALL_UUID}))
 same => n,Answer()
 same => n,AudioSocket(${CALL_UUID},127.0.0.1:${AUDIOSOCKET_PORT})
 same => n,Hangup()

exten => h,1,NoOp(Channel hung up on from-provider-24ithub: ${HANGUPCAUSE})


; ==============================================================================
; OUTBOUND ANSWER-GATED CONTEXT: [outbound-ai-answered]
; Executed ONLY when destination customer genuinely answers the phone
; ==============================================================================
[outbound-ai-answered]
exten => _[0-9a-zA-Z-].,1,NoOp(=== OUTBOUND CALL ANSWERED BY CUSTOMER ===)
 same => n,Set(CALL_UUID=${EXTEN})
 same => n,NoOp(Starting AudioSocket media for answered UUID: ${CALL_UUID})
 same => n,Set(CHANNEL(hangup_handler_push)=call-hangup-handler,s,1(${CALL_UUID}))
 same => n,Answer()
 ; Notify backend that real answer event occurred
 same => n,Set(ANSWER_URL=http://${BACKEND_HOST}:${BACKEND_PORT}/api/webhooks/asterisk/answered?call_uuid=${CALL_UUID})
 same => n,Set(ACK_RESP=${CURL(${ANSWER_URL})})
 same => n,NoOp(Backend Answer ACK: ${ACK_RESP})
 ; Stream greeting and bidirectional AI speech
 same => n,AudioSocket(${CALL_UUID},127.0.0.1:${AUDIOSOCKET_PORT})
 same => n,Hangup()

exten => s,1,NoOp(=== OUTBOUND CALL ANSWERED (s fallback) ===)
 same => n,GotoIf($["${CALL_UUID}" != ""]?outbound-ai-answered,${CALL_UUID},1:no_uuid)
 same => n(no_uuid),NoOp(ERROR: Outbound answered with missing CALL_UUID)
 same => n,Hangup()


; ==============================================================================
; GLOBAL HANGUP HANDLER SUBROUTINE: [call-hangup-handler]
; Notifies FastAPI backend with authoritative Q.850 cause code & duration
; ==============================================================================
[call-hangup-handler]
exten => s,1,NoOp(=== CALL HANGUP HANDLER ===)
 same => n,Set(H_UUID=${ARG1})
 same => n,Set(H_CAUSE=${HANGUPCAUSE})
 same => n,Set(H_DUR=${CDR(billsec)})
 same => n,NoOp(Channel Hangup: UUID=${H_UUID}, Cause=${H_CAUSE}, Duration=${H_DUR}s)
 same => n,GotoIf($["${H_UUID}" = ""]?handler_done)
 same => n,Set(NOTIFY_URL=http://${BACKEND_HOST}:${BACKEND_PORT}/api/webhooks/asterisk/hangup?call_uuid=${H_UUID}&cause=${H_CAUSE}&duration=${H_DUR})
 same => n,Set(H_RES=${CURL(${NOTIFY_URL})})
 same => n,NoOp(Backend Hangup Result: ${H_RES})
 same => n(handler_done),Return()
