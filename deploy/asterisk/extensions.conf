; ==============================================================================
; Asterisk Extensions Dialplan (Production Hardened)
; Inbound: from-provider-24ithub -> FastAPI Port 8010 -> AudioSocket Port 9095
; Outbound: Answer-Gated outbound-ai-answered -> AudioSocket Port 9095
; Hangup: call-hangup-handler -> FastAPI Hangup Webhook
; ==============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

; Global variables
[globals]
BACKEND_HOST=127.0.0.1
BACKEND_PORT=8010
AUDIOSOCKET_PORT=9095
WEBHOOK_SECRET=your_shared_webhook_secret

; ==============================================================================
; INBOUND ROUTING CONTEXT: [from-provider-24ithub]
; Handles incoming PSTN calls delivered via 24IT Hub SIP trunk
; ==============================================================================
[from-provider-24ithub]
; Match standard phone numbers (starting with + or digits 0-9)
exten => _[+0-9].,1,NoOp(=== INBOUND PSTN CALL DETECTED ON TRUNK ===)
 same => n,Set(RAW_CALLER=${CALLERID(num)})
 same => n,Set(RAW_EXTEN=${EXTEN})
 same => n,Set(ASTERISK_UNIQUEID=${UNIQUEID})
 
 ; Normalize dialed DID and caller numbers
 same => n,Set(CLEAN_DID=${FILTER(0123456789,${RAW_EXTEN})})
 same => n,Set(CLEAN_CALLER=${FILTER(0123456789,${RAW_CALLER})})
 same => n,NoOp(Inbound Normalized: Caller=${CLEAN_CALLER}, DID=${CLEAN_DID}, ChannelUniqueID=${ASTERISK_UNIQUEID})
 
 ; Request Call Authorization from FastAPI backend
 same => n,Set(AUTH_URL=http://${BACKEND_HOST}:${BACKEND_PORT}/api/webhooks/asterisk/inbound?caller_id=${CLEAN_CALLER}&dialed_number=${CLEAN_DID}&asterisk_uniqueid=${ASTERISK_UNIQUEID}&provider=asterisk&secret=${WEBHOOK_SECRET})
 same => n,Set(CALL_PERMISSION=${CURL(${AUTH_URL})})
 same => n,NoOp(FastAPI Inbound Auth Response: ${CALL_PERMISSION})
 
 ; Verify response format: must begin with ALLOW: and contain a 36-character RFC 4122 UUID
 same => n,GotoIf($["${CALL_PERMISSION:0:6}" = "ALLOW:"]?extract_uuid:reject_call)
 
 same => n(extract_uuid),Set(CALL_UUID=${CALL_PERMISSION:6})
 ; Strict validation: RFC 4122 UUID must be exactly 36 characters
 same => n,GotoIf($[${LEN(${CALL_UUID})} = 36]?uuid_valid:uuid_invalid)
 
 same => n(uuid_invalid),NoOp(CRITICAL: FastAPI returned invalid UUID '${CALL_UUID}' - Failing safely)
 same => n,Hangup(21)
 
 same => n(reject_call),NoOp(Call rejected by authorization policy: ${CALL_PERMISSION})
 same => n,Hangup(21)
 
 same => n(uuid_valid),NoOp(Call Authorized: UUID=${CALL_UUID}, ChannelUniqueID=${ASTERISK_UNIQUEID})
 same => n,Set(CHANNEL(hangup_handler_push)=call-hangup-handler,s,1(${CALL_UUID},${ASTERISK_UNIQUEID}))
 same => n,Answer()
 same => n,AudioSocket(${CALL_UUID},127.0.0.1:${AUDIOSOCKET_PORT})
 same => n,Hangup()

; Fallback for carrier sending 's' extension instead of dialed digits
exten => s,1,NoOp(=== INBOUND CALL ON TRUNK (s extension) ===)
 same => n,Set(SIP_TO=${PJSIP_HEADER(read,To)})
 same => n,Set(EXTRACTED_DID=${CUT(CUT(SIP_TO,@,1),:,2)})
 same => n,Set(CLEAN_EXTRACTED=${FILTER(0123456789,${EXTRACTED_DID})})
 same => n,GotoIf($["${CLEAN_EXTRACTED}" != ""]?from-provider-24ithub,${CLEAN_EXTRACTED},1:no_did)
 same => n(no_did),NoOp(ERROR: Inbound 's' call missing DID in SIP To header)
 same => n,Hangup(21)

; Dedicated hangup extension: cleanly terminates WITHOUT re-running authorization or CURL
exten => h,1,NoOp(=== INBOUND CHANNEL HANGUP COMPLETED: Cause=${HANGUPCAUSE} ===)


; ==============================================================================
; OUTBOUND DIALER CONTEXT: [outbound-dial-carrier]
; Solves the Indian carrier / ConnexCS / WorldPhone CLI requirement
; Sets CallerID and injects P-Asserted-Identity / Remote-Party-ID on PJSIP leg
; Syntax: Local/${TARGET_NUM}@outbound-dial-carrier
; ==============================================================================
[outbound-dial-carrier]
exten => _[+0-9].,1,NoOp(=== OUTBOUND DIAL CARRIER: ${EXTEN} ===)
 same => n,Set(TARGET_NUM=${EXTEN})
 same => n,Set(TARGET_TRUNK=provider-10ca861d-d002-4f52-8b2a-fbefea08a6de)
 same => n,Set(TARGET_CLI=911168140253)
 same => n,Set(CALLERID(all)="${TARGET_CLI}" <${TARGET_CLI}>)
 same => n,Set(CALLERID(num)=${TARGET_CLI})
 same => n,Set(CALLERID(name)=${TARGET_CLI})
 same => n,Set(CALLERID(pres)=allowed)
 same => n,Dial(PJSIP/${TARGET_NUM}@${TARGET_TRUNK},60,b(outbound-predial-handler^s^1))
 same => n,Hangup()

[outbound-predial-handler]
exten => s,1,NoOp(=== OUTBOUND PRE-DIAL HANDLER: Setting Headers on PJSIP Leg ===)
 same => n,Set(OUT_CLI=911168140253)
 same => n,Set(CALLERID(all)="${OUT_CLI}" <${OUT_CLI}>)
 same => n,Set(CALLERID(num)=${OUT_CLI})
 same => n,Set(CALLERID(name)=${OUT_CLI})
 same => n,Set(CALLERID(pres)=allowed)
 same => n,Set(PJSIP_HEADER(add,P-Asserted-Identity)=<sip:${OUT_CLI}@cpbx.24ithub.com>)
 same => n,Set(PJSIP_HEADER(add,Remote-Party-ID)=<sip:${OUT_CLI}@cpbx.24ithub.com>\;party=calling\;privacy=off\;screen=no)
 same => n,Return()


; ==============================================================================
; OUTBOUND ANSWER-GATED CONTEXT: [outbound-ai-answered]
; Executed ONLY when destination customer genuinely answers the phone
; ==============================================================================
[outbound-ai-answered]
exten => _[-0-9a-zA-Z].,1,NoOp(=== OUTBOUND CALL ANSWERED BY CUSTOMER: ${EXTEN} ===)
 same => n,Set(CALL_UUID=${EXTEN})
 same => n,Set(ASTERISK_UNIQUEID=${UNIQUEID})
 same => n,NoOp(Starting AudioSocket media for answered UUID: ${CALL_UUID} (Channel UniqueID: ${ASTERISK_UNIQUEID}))
 same => n,Set(CHANNEL(hangup_handler_push)=call-hangup-handler,s,1(${CALL_UUID},${ASTERISK_UNIQUEID}))
 same => n,Answer()
 same => n,AudioSocket(${CALL_UUID},127.0.0.1:${AUDIOSOCKET_PORT})
 same => n,Hangup()

exten => s,1,NoOp(=== OUTBOUND CALL ANSWERED (s fallback) ===)
 same => n,GotoIf($["${CALL_UUID}" != ""]?outbound-ai-answered,${CALL_UUID},1:no_uuid)
 same => n(no_uuid),NoOp(ERROR: Outbound answered with missing CALL_UUID)
 same => n,Hangup()

exten => h,1,NoOp(=== OUTBOUND CHANNEL HANGUP COMPLETED: Cause=${HANGUPCAUSE} ===)


; ==============================================================================
; GLOBAL HANGUP HANDLER SUBROUTINE: [call-hangup-handler]
; Notifies FastAPI backend with authoritative Q.850 cause code & duration
; ==============================================================================
[call-hangup-handler]
exten => s,1,NoOp(=== CALL HANGUP HANDLER ===)
 same => n,Set(H_UUID=${ARG1})
 same => n,Set(H_UNIQUEID=${ARG2})
 same => n,Set(H_CAUSE=${HANGUPCAUSE})
 same => n,Set(H_DUR=${CDR(billsec)})
 same => n,NoOp(Channel Hangup: UUID=${H_UUID}, UniqueID=${H_UNIQUEID}, Cause=${H_CAUSE}, Duration=${H_DUR}s)
 same => n,GotoIf($["${H_UUID}" = "" & "${H_UNIQUEID}" = ""]?handler_done)
 same => n,Set(NOTIFY_URL=http://${BACKEND_HOST}:${BACKEND_PORT}/api/webhooks/asterisk/hangup?call_uuid=${H_UUID}&asterisk_uniqueid=${H_UNIQUEID}&cause=${H_CAUSE}&duration=${H_DUR})
 same => n,Set(H_RES=${CURL(${NOTIFY_URL})})
 same => n,NoOp(Backend Hangup Result: ${H_RES})
 same => n(handler_done),Return()
