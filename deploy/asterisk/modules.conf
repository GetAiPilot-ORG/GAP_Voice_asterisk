; ==============================================================================
; Asterisk Module Loader Configuration
; ==============================================================================

[modules]
autoload=yes

; Preload PJSIP core
preload => res_pjsip.so
preload => res_pjsip_session.so

; Explicitly require critical modules
load => app_audiosocket.so
load => res_audiosocket.so
load => func_curl.so
load => func_pjsip_header.so
load => func_strings.so
load => func_uri.so
load => codec_ulaw.so
load => codec_alaw.so
load => format_pcm.so
load => format_wav.so
load => res_rtp_asterisk.so
load => app_dial.so
load => app_playback.so
